name: Offline tests

on:
  push:
    branches: [master, feat/research-mode-pr2]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e . pytest
      # test_tui_keys.py is a manual keyboard/terminal playground.
      - name: Offline tests (no model requests)
        run: python -m pytest tests -q --ignore=tests/test_tui_keys.py
      - name: Archive tested source
        if: always()
        run: git archive --format=tar.gz HEAD -o source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tested-source
          path: source.tar.gz
          retention-days: 3
